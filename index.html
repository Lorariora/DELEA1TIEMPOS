<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>DELE A1 時態</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: same study-card system as the DELE A1 動詞 page — one card per tense, tap a verb or row to open example sentences. */
:root{--bg:#f6f7f5;--card:#fff;--ink:#2b3038;--mute:#7a8290;--line:#e4e7e3;--g:#5a7a5a;--gh:#8fa88f;--gl:#d3e0d1;--b:#2f5385;--tan:#8a6a50;--tanbg:#eadfd3;--foot:#eff1f3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--ink:#e6e8eb;--mute:#8b93a1;--line:#2c3038;--g:#9dbb9d;--gh:#3f5a3f;--gl:#2c3f2c;--b:#8fb0e0;--tan:#d3b394;--tanbg:#3a2f26;--foot:#23272e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--ink:#e6e8eb;--mute:#8b93a1;--line:#2c3038;--g:#9dbb9d;--gh:#3f5a3f;--gl:#2c3f2c;--b:#8fb0e0;--tan:#d3b394;--tanbg:#3a2f26;--foot:#23272e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.5}
main{max-width:860px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:28px;margin:8px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;min-width:0}
h2{display:flex;align-items:center;gap:10px;font-size:20px;margin:0 0 6px}
.n{background:var(--g);color:var(--card);width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.note{color:var(--mute);font-size:14px;margin:0 0 12px}
h3{font-size:15px;color:var(--tan);margin:16px 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{background:var(--gh);color:#fff;padding:7px 8px;font-weight:600;white-space:nowrap}
td{border:1px solid var(--line);padding:6px 8px;text-align:center;white-space:nowrap}
td.l{background:var(--foot);font-weight:600}
td b{color:var(--g)}
table.tl td{text-align:left;white-space:normal}
table.tl td.l{white-space:nowrap}
td.xl{text-align:left;white-space:normal;background:var(--foot)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.v{border:1px solid var(--line);border-radius:12px;padding:8px 10px;cursor:pointer;position:relative;min-width:0}
.v b{display:block;color:var(--g);font-size:17px}
.v span{font-size:13px;color:var(--b)}
.v i{display:block;font-size:12px;color:var(--mute);font-style:normal}
.v:not(.open)::after{content:"▾";position:absolute;right:10px;top:8px;color:var(--mute);font-size:12px}
.v.open{grid-column:1/-1;background:var(--foot)}
.ex{margin-top:8px;border-top:1px dashed var(--line);padding-top:6px}
.ex p{margin:6px 0}
.ex .es{display:block;font-size:16px;color:var(--ink)}
.ex .zh{display:block;font-size:14px;color:var(--b)}
.ex em{font-style:normal;font-size:12px;background:var(--tanbg);color:var(--tan);border-radius:6px;padding:1px 7px;display:inline-block;margin-bottom:2px}
tr.r{cursor:pointer}
tr.r td.l::after{content:" ▾";color:var(--mute);font-size:12px}
.box{background:var(--foot);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.box p{margin:3px 0}
.es{font-size:16px}.zh{color:var(--b)}
a.lk{color:var(--g);text-decoration:none}
a.lk:hover{text-decoration:underline}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
nav a{font-size:13px;color:var(--g);border:1px solid var(--line);border-radius:999px;padding:3px 10px;text-decoration:none}
.v:focus-visible,tr.r:focus-visible,nav a:focus-visible,a.lk:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.scroll{overflow:visible}
th,td{white-space:normal;overflow-wrap:anywhere;padding:5px 3px;font-size:clamp(9.5px,2.6vw,15px)}
th{font-size:clamp(9px,2.3vw,14px)}
table.tl td{font-size:clamp(10.5px,2.9vw,15px)}
table.tl td.l,td.l{white-space:nowrap;overflow-wrap:normal}
td.sp{color:var(--mute);font-size:clamp(9.5px,2.4vw,13px)!important}
@media (max-width:480px){.card{padding:12px}}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0;margin:0 0 8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;flex:none;background:var(--card)}
@media (min-width:1120px){html{scroll-padding-top:16px}nav{position:fixed;top:24px;left:calc(50% - 430px - 132px);width:120px;flex-direction:column;overflow:visible;background:none;padding:0}nav a{border-radius:12px}}
</style>

<main>
<h1>DELE A1 時態</h1>
<nav id="nav"></nav>
<div id="cards"></div>
</main>

<script>
const H=["","yo","tú","él/ella<br>usted","nosotros","vosotros","ellos/ellas<br>ustedes"];
const T=(head,rows,o={})=>{const bold=o.bold!==false;return `<div class="scroll"><table><tr>${head.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>{const cells=Array.isArray(r[1])?r[1]:r[1].split(" ");return `<tr${r[2]?` class="r" data-k="${r[2]}" tabindex="0"`:""}><td class="l">${r[0]}</td>${cells.map(x=>`<td>${bold?`<b>${x}</b>`:x}</td>`).join("")}</tr>`}).join("")}</table></div>`};
const V=items=>`<div class="grid">${items.map(a=>`<div class="v" data-k="${a[0]}" tabindex="0"><b>${a[1]}</b><span>${a[2]}</span>${a[3]?`<i>${a[3]}</i>`:""}</div>`).join("")}</div>`;
const B=arr=>`<div class="box">${arr.map(s=>{const[p,q]=s.split("|");return `<p class="es">${p} <span class="zh">${q}</span></p>`}).join("")}</div>`;
const M=t=>`<div class="box"><p><b>時間詞</b>：${t}</p></div>`;
const N=t=>`<div class="box"><p>${t}</p></div>`;
const S=t=>`<h3>${t}</h3>`;
let _n=0;const C=(id,n,title,note,body)=>`<div class="card" id="${id}"><h2><span class="n">${++_n}</span>${title}</h2>${note?`<p class="note">${note}</p>`:""}${body}</div>`;

const OV=[
["現在簡單式","t0","Presente","習慣、現在的狀態、確定的近期安排","hoy, ahora, todos los días, siempre, a veces, nunca"],
["現在進行式","t1","Estar + gerundio","正在發生的動作","ahora, en este momento"],
["現在完成式","t3","Pretérito perfecto compuesto","與現在有關，或今天、這週的事","hoy, esta semana, ya, todavía no, alguna vez"],
["簡單過去式","t4","Pretérito indefinido","已結束、時間明確的事","ayer, anoche, el año pasado, hace dos días"],
["未完成過去式","t5","Pretérito imperfecto","過去的習慣、背景、描述","antes, de niño, siempre, todos los días"],
["未來式","t6","Ir a + infinitivo<br>Futuro simple","近未來：即將做、已打算的事<br>簡單未來式：預測、承諾、較遠的未來","mañana, esta noche, pronto<br>el año que viene, algún día"],
["條件式","t8","Condicional simple","禮貌請求、願望、建議、假設","quisiera, me gustaría, ¿podría…?"],
["命令式","t7","Imperativo","指示、請求、建議","por favor"],
["現在虛擬式","t11","Presente de subjuntivo","願望、要求、不確定、cuando + 未來","espero que, quiero que, ojalá, cuando"],
["未完成過去虛擬式","t12","Pretérito imperfecto de subjuntivo","委婉願望、與現實相反的假設","quisiera, si tuviera…, ojalá tuviera…"]
];
const ov=`<div class="card" id="ov"><h2>時態總覽</h2><div class="scroll"><table class="tl"><tr><th>時態</th><th>用途</th><th>常見時間詞</th></tr>${OV.map(r=>`<tr><td class="l"><a class="lk" href="#${r[1]}">${r[0]}</a></td><td>${r[3]}</td><td>${r[4]}</td></tr>`).join("")}</table></div></div>`;

const cards=[ov];

cards.push(C("t0",0,"現在簡單式（Presente）","習慣、現在的狀態、正在發生的事，也可表示確定的近期安排。",
 S("規則字尾與範例")+T(H,[["-ar","-o -as -a -amos -áis -an"],["-er","-o -es -e -emos -éis -en"],["-ir","-o -es -e -imos -ís -en"],["hablar","hablo hablas habla hablamos habláis hablan"],["comer","como comes come comemos coméis comen"],["vivir","vivo vives vive vivimos vivís viven"]])+
 S("常用不規則")+T(H,[["ser","soy eres es somos sois son","pr-ser"],["estar","estoy estás está estamos estáis están","pr-estar"],["ir","voy vas va vamos vais van","pr-ir"],["tener","tengo tienes tiene tenemos tenéis tienen","pr-tener"],["venir","vengo vienes viene venimos venís vienen","pr-venir"],["hacer","hago haces hace hacemos hacéis hacen","pr-hacer"],["decir","digo dices dice decimos decís dicen","pr-decir"],["querer","quiero quieres quiere queremos queréis quieren","pr-querer"],["poder","puedo puedes puede podemos podéis pueden","pr-poder"]])+
 S("詞幹變化（nosotros / vosotros 不變）")+V([["pr-empezar","empiezo","empezar 開始","e → ie"],["pr-pensar","pienso","pensar 想","e → ie"],["pr-dormir","duermo","dormir 睡覺","o → ue"],["pr-volver","vuelvo","volver 回來","o → ue"],["pr-pedir","pido","pedir 點；要求","e → i"],["pr-jugar","juego","jugar 玩","u → ue"]])+
 S("只有 yo 形不規則")+V([["pr-poner","pongo","poner 放"],["pr-salir","salgo","salir 出去"],["pr-saber","sé","saber 知道"],["pr-dar","doy","dar 給"],["pr-ver","veo","ver 看見"],["pr-conocer","conozco","conocer 認識"],["pr-traer","traigo","traer 帶來"]])+
 B(["Vivo en Taipéi.|我住在台北。","Como arroz todos los días.|我每天吃米飯。","Mañana trabajo hasta las cinco.|明天我工作到五點。"])+
 M("hoy, ahora, todos los días, siempre, normalmente, a veces, nunca")));

cards.push(C("t1",1,"現在進行式","正在發生的動作。estar 變位 + 動名詞（gerundio）。",
 S("estar 現在式")+T(H,[["estar","estoy estás está estamos estáis están"]])+
 S("動名詞 gerundio 字尾")+T(["","字尾","例子"],[["-ar",["-ando","hablar → hablando"]],["-er",["-iendo","comer → comiendo"]],["-ir",["-iendo","vivir → viviendo"]]],{bold:false})+
 S("不規則動名詞 gerundio")+V([["g-leer","leyendo","leer 讀","i → y"],["g-oir","oyendo","oír 聽見","i → y"],["g-dormir","durmiendo","dormir 睡覺","o → u"],["g-pedir","pidiendo","pedir 點；要求","e → i"],["g-decir","diciendo","decir 說","e → i"],["g-ir","yendo","ir 去","i → y"]])+
 B(["Estoy estudiando español.|我正在學西班牙文。","¿Qué estás haciendo?|你在做什麼？","Ella está cocinando.|她正在煮飯。","Estamos comiendo ahora.|我們現在在吃飯。"])+
 N("代名詞可放前面，也可接在後面：<span class=\"es\">Me estoy duchando. / Estoy duchándome.</span> <span class=\"zh\">我正在淋浴。</span>")+
 M("ahora, ahora mismo, en este momento")));

cards.push(C("t3",3,"現在完成式","haber 現在式 + 過去分詞（participio）。說今天、這週、這個月等「還沒結束的時間」裡發生的事。",
 S("haber 現在式")+T(H,[["haber","he has ha hemos habéis han"]])+
 S("過去分詞 participio 字尾")+T(["","字尾","例子"],[["-ar",["-ado","hablar → hablado"]],["-er",["-ido","comer → comido"]],["-ir",["-ido","vivir → vivido"]]],{bold:false})+
 S("不規則過去分詞 participio")+V([["p-hacer","hecho","hacer 做"],["p-decir","dicho","decir 說"],["p-escribir","escrito","escribir 寫"],["p-ver","visto","ver 看見"],["p-abrir","abierto","abrir 打開"],["p-poner","puesto","poner 放"],["p-volver","vuelto","volver 回來"],["p-romper","roto","romper 打破"]])+
 B(["Hoy he comido paella.|今天我吃了西班牙燉飯。","Esta semana hemos trabajado mucho.|這個星期我們工作很多。","¿Ya has desayunado?|你吃過早餐了嗎？","Todavía no he terminado.|我還沒完成。","¿Has estado en España alguna vez?|你去過西班牙嗎？","Nunca he viajado en avión.|我從來沒搭過飛機。"])+
 N("haber 和過去分詞（participio）之間不能插入其他字；否定的 no 放在 haber 前面：<span class=\"es\">No he comido.</span> <span class=\"zh\">我還沒吃。</span>")+
 M("hoy, esta mañana, esta semana, este año, ya, todavía no, alguna vez, nunca")));

cards.push(C("t4",4,"簡單過去式","已經結束、時間明確的事，也用來說一連串動作。",
 S("規則字尾與範例")+T(H,[["-ar","-é -aste -ó -amos -asteis -aron"],["-er / -ir","-í -iste -ió -imos -isteis -ieron"],["hablar","hablé hablaste habló hablamos hablasteis hablaron"],["comer","comí comiste comió comimos comisteis comieron"],["vivir","viví viviste vivió vivimos vivisteis vivieron"]])+
 S("yo 形拼寫變化")+V([["yo-buscar","-car → -qué","buscar 找","busqué"],["yo-llegar","-gar → -gué","llegar 到達","llegué"],["yo-empezar","-zar → -cé","empezar 開始","empecé"]])+
  S("常用不規則")+T(H,[
  ["ser / ir","fui fuiste fue fuimos fuisteis fueron","pi-ser"],
  ["leer","leí leíste leyó leímos leísteis leyeron","pi-leer"],
  ["hacer","hice hiciste hizo hicimos hicisteis hicieron","pi-hacer"],
  ["estar","estuve estuviste estuvo estuvimos estuvisteis estuvieron","pi-estar"],
  ["tener","tuve tuviste tuvo tuvimos tuvisteis tuvieron","pi-tener"],
  ["dar","di diste dio dimos disteis dieron","pi-dar"],
  ["ver","vi viste vio vimos visteis vieron","pi-ver"],
  ["poder","pude pudiste pudo pudimos pudisteis pudieron","pi-poder"],
  ["venir","vine viniste vino vinimos vinisteis vinieron","pi-venir"],
  ["decir","dije dijiste dijo dijimos dijisteis dijeron","pi-decir"],
  ["poner","puse pusiste puso pusimos pusisteis pusieron","pi-poner"]])+
 N("ser 和 ir 的過去式同形，要看上下文判斷。")+
 B(["Ayer hablé con Ana.|昨天我和 Ana 說話。","Anoche comimos en un restaurante.|昨晚我們在餐廳吃飯。","El año pasado viví en Madrid.|去年我住在馬德里。","Ayer llegué a casa tarde.|昨天我很晚到家。"])+
 M("ayer, anoche, anteayer, el lunes pasado, la semana pasada, el año pasado, hace dos días, en 2020")));

cards.push(C("t5",5,"未完成過去式","過去的習慣、背景、描述，不強調動作何時結束。",
 S("規則字尾與範例")+T(H,[["-ar","-aba -abas -aba -ábamos -abais -aban"],["-er / -ir","-ía -ías -ía -íamos -íais -ían"],["hablar","hablaba hablabas hablaba hablábamos hablabais hablaban"],["comer","comía comías comía comíamos comíais comían"],["vivir","vivía vivías vivía vivíamos vivíais vivían"]])+
 S("只有三個不規則")+T(H,[
  ["ser","era eras era éramos erais eran","im-ser"],
  ["ir","iba ibas iba íbamos ibais iban","im-ir"],
  ["ver","veía veías veía veíamos veíais veían","im-ver"]])+
 S("使用情境")+V([["u-hab","習慣","過去經常做"],["u-des","描述","人、物、地方"],["u-age","年齡、時間","那時幾歲、幾點"],["u-bg","進行中的背景","被別的事打斷"]])+
 B(["Antes vivía en Taipéi.|我以前住在台北。","Siempre desayunábamos juntos.|我們以前總是一起吃早餐。"])+
 M("antes, de niño / de niña, de pequeño, siempre, todos los días, a menudo, mientras")));

cards.push(C("t6",6,"未來式：近未來與簡單未來式","兩者形式不同、意思相近，所以放在同一張。口語常用「ir a + 原形」代替簡單未來式。",
 S("近未來（Ir a + infinitivo）：即將發生或已計畫好的事")+T(H,[["ir","voy vas va vamos vais van"]])+
 B(["Voy a estudiar esta noche.|今晚我要讀書。","¿Qué vas a hacer mañana?|你明天要做什麼？","Ellos van a viajar en verano.|他們夏天要去旅行。","Hoy va a llover.|今天會下雨。"])+
 N("<b>Vamos a + 原形</b> 也可以表示「我們來…吧」：<span class='es'>¡Vamos a bailar!</span> <span class='zh'>我們來跳舞吧！</span>")+
 N("<b>差別</b>：近未來用在計畫、意圖、眼前即將發生的事；簡單未來式用在預測、承諾、較遠或較正式的未來，也能表示推測。")+
 S("簡單未來式（Futuro simple）：原形 + 字尾（三種動詞都一樣）")+T(H,[["原形 +","-é -ás -á -emos -éis -án"],["hablar","hablaré hablarás hablará hablaremos hablaréis hablarán"],["comer","comeré comerás comerá comeremos comeréis comerán"],["vivir","viviré vivirás vivirá viviremos viviréis vivirán"]])+
 S("不規則詞幹（字尾不變）")+V([["f-tener","tendré","tener 有","詞幹 tendr-"],["f-hacer","haré","hacer 做","詞幹 har-"],["f-poder","podré","poder 能","詞幹 podr-"],["f-venir","vendré","venir 來","詞幹 vendr-"],["f-salir","saldré","salir 出去","詞幹 saldr-"],["f-decir","diré","decir 說","詞幹 dir-"],["f-querer","querré","querer 想要","詞幹 querr-"],["f-saber","sabré","saber 知道","詞幹 sabr-"],["f-poner","pondré","poner 放","詞幹 pondr-"],["f-haber","habrá","haber（hay）","詞幹 habr-"]])+
 B(["Mañana trabajaré en casa.|明天我會在家工作。","El próximo año viajaré a España.|明年我會去西班牙旅行。","Ana vivirá en Madrid.|Ana 將住在馬德里。"])+
 M("mañana, el año que viene, el próximo mes, algún día")));

cards.push(C("t7",7,"命令式","下指示、請求、給建議。",
 T(["","hablar","comer","escribir"],[["tú +",["habla","come","escribe"]],["tú −",["no hables","no comas","no escribas"]],["usted +",["hable","coma","escriba"]],["ustedes +",["hablen","coman","escriban"]],["vosotros +",["hablad","comed","escribid"]]])+
 N("<p><b>tú 肯定</b>：用 él / ella 的現在式形。</p><p><b>tú 否定</b>：no + -ar 變 -es、-er / -ir 變 -as。</p><p><b>usted / ustedes</b>：-ar 變 -e / -en，-er / -ir 變 -a / -an。</p><p><b>vosotros 肯定</b>：原形的 -r 換成 -d。</p>")+
